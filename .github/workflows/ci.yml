# CI: unit tests (infra + Lambda) and a firmware build.
# Only runs when the pushed commit's message contains "[ci:run-tests]".
# No AWS access and no deploy — nothing here needs credentials.
#
# Supply chain: everything downloaded is pinned to an exact version —
#   - actions:            commit SHA (a moved tag can't change what runs)
#   - uv, Python:         exact versions below
#   - Python packages:    uv.lock (exact versions + SHA-256 hashes), --locked
#   - PlatformIO:         in uv.lock too (the "firmware" group)
#   - ST platform:        exact commit in firmware/platformio.ini
name: CI

on:
  push:

permissions:
  contents: read

env:
  UV_VERSION: "0.12.19"
  PYTHON_VERSION: "3.12.14"

jobs:
  tests:
    name: Tests (infra + Lambda)
    if: contains(github.event.head_commit.message, '[ci:run-tests]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --locked --python "$PYTHON_VERSION"
      - run: uv run pytest

  firmware:
    name: Firmware build
    if: contains(github.event.head_commit.message, '[ci:run-tests]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('firmware/platformio.ini') }}
      - run: uv sync --locked --only-group firmware --python "$PYTHON_VERSION"
      - run: uv run pio run -d firmware
