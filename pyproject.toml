[project]
name = "cloud-clock-scaling"
version = "0.1.0"
description = "STM32 clock speed driven from AWS IoT — CDK infra, Lambda"
requires-python = ">=3.12"
dependencies = []

# One venv for the whole repo. Groups split by part of the project;
# all are installed by default (`uv sync`).
[dependency-groups]
infra = [
    "aws-cdk-lib>=2.270.0,<3.0.0",
    "constructs>=10.5.0,<11.0.0",
]
dev = [
    "pytest",
    "boto3",  # built into the Lambda runtime; needed locally for tests
]
firmware = [
    "platformio==6.2.0",  # build tool for firmware/ (CI); locked with hashes in uv.lock
]

[tool.uv]
package = false
default-groups = ["infra", "dev"]

[tool.pytest.ini_options]
testpaths = ["infra/cdk/tests", "infra/decide-clock-lambda/tests"]
