; STM32 Nucleo-F411RE firmware — bare-metal (registers only, no HAL).
; stm32cube framework is used only for the startup file + vector table.

[env:nucleo_f411re]
; Pinned to the v20.0.0 release commit — a moved tag can't change what builds.
platform = https://github.com/platformio/platform-ststm32.git#7d9d29a217b4a52530485b77b65c4646f25dd8c6
board = nucleo_f411re
framework = stm32cube
build_type = debug
